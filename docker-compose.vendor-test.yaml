services:
  server:
    # docker-compose.ce.yaml overrides Dockerfile.dev's ENTRYPOINT with
    # /app/entrypoint.sh, which does not exist in the development image.
    # Restore the development entrypoint for this source-built test stack.
    entrypoint: ["/app/server-dev-entrypoint.sh"]
    environment:
      # Vendor integrations persist tenant credentials through Alga's filesystem
      # secret provider. Docker's /run/secrets location is intended for mounted
      # application secrets, so use a writable bind for tenant-level test secrets.
      SECRET_FS_BASE_PATH: /app/runtime-secrets
      # Next.js dev mode blocks HMR/RSC assets loaded from a remote host unless
      # that host is explicitly allowed. Set DEV_ALLOWED_ORIGINS in .env to the
      # IP/hostname used in the browser (for example, 206.168.173.214).
      DEV_ALLOWED_ORIGINS: ${DEV_ALLOWED_ORIGINS:-}
      # Disable PostHog/usage telemetry on the isolated vendor test stack. This
      # avoids browser-side fetch failures when the test VM cannot reach PostHog.
      ALGA_USAGE_STATS: "false"
      NEXT_PUBLIC_ALGA_USAGE_STATS: "false"
      # The stock dev image does not prebuild every workspace dependency. Build
      # the same dependency graph used by the normal CE build before starting
      # Next so package exports never point at missing dist/ files.
      ALGA_BUILD_SERVER_DEPS: "1"
    volumes:
      - type: bind
        source: ./secrets
        target: /app/runtime-secrets
